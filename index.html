<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYPE TO SURVIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
--white: #d9f6ef;
--dim: #6d857f;
--bg: #050505;
}

html, body {
width: 100%; height: 100%;
overflow: hidden;
background: var(--bg);
color: var(--white);
font-family: 'Share Tech Mono', monospace;
}

#stage{
position: fixed;
inset: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
}

#stage::after {
content: '';
position: fixed;
inset: 0;
background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.82) 100%);
pointer-events: none;
z-index: 10;
}

#scanlines {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 20;
background: repeating-linear-gradient(
to bottom,
transparent,
transparent 2px,
rgba(0,0,0,0.18) 2px,
rgba(0,0,0,0.18) 4px
);
animation: scanDrift 8s linear infinite;
opacity: 0.5;
}

@keyframes scanDrift {
from { background-position: 0 0; }
to { background-position: 0 100vh; }
}

#noise {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 21;
opacity: 0.04;
}

#glitch {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 22;
}

#presence {
position: fixed;
bottom: 0;
left: 50%;
width: 340px;
height: 180px;
background: radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.97) 0%, transparent 70%);
filter: blur(28px);
pointer-events: none;
z-index: 9;
opacity: 0;
transform-origin: bottom center;
transition: opacity 0.6s ease, transform 0.6s ease;
}

#jumpscare {
position: fixed;
inset: 0;
z-index: 200;
display: none;
overflow: hidden;
background: #fff;
}

#jumpscare-shape {
position: absolute;
bottom: -10%;
left: 50%;
width: 200vw;
height: 180vh;
transform: translateX(-50%);
transform-origin: bottom center;
background: radial-gradient(ellipse at 50% 100%,
rgba(0,0,0,1) 0%, rgba(0,0,0,0.95) 18%, rgba(20,0,0,0.7) 38%, transparent 62%);
}

#jumpscare-cyan{
position: absolute;
inset: 0;
background: radial-gradient(ellipse at 52% 100%, rgba(0,230,255,0.18) 0%, transparent 55%);
}

#jumpscare-red{
position: absolute;
inset: 0;
background: radial-gradient(ellipse at 48% 100%, rgba(255,0,0,0.15) 0%, transparent 55%);
}


#ghost-overlay {
position: fixed;
inset: 0;
z-index: 203;
display: none;
pointer-events: none;
background: rgba(255,255,255,0.035);
}

#ghost-shape {
position: absolute;
inset: 0;
filter: blur(10px);
}


#mute-btn {
position: fixed;
bottom: 18px;
right: 18px;
z-index: 60;
background: none;
border: 1px solid rgba(109,133,127,0.22);
color: rgba(109,133,127,0.38);
font-family: 'Share Tech Mono', monospace;
font-size: 11px;
letter-spacing: 0.08em;
padding: 4px 9px;
cursor: pointer;
transition: border-color 0.2s, color 0.2s;
}

#mute-btn:hover { border-color: rgba(109,133,127,0.55); color: rgba(109,133,127,0.65); }
#mute-btn.muted { color: rgba(109,133,127,0.18); border-color: rgba(109,133,127,0.1); }

#hud {
position: fixed;
top: 0; left: 0; right: 0;
z-index: 30;
padding: 14px 18px 0;
display: flex;
align-items: center;
}

#rec-group {
display: flex;
align-items: center;
gap: 7px;
margin-right: auto;
}

#rec-dot {
width: 8px; height: 8px;
border-radius: 50%;
background: #cc2222;
flex-shrink: 0;
}

#rec-dot.blink { background: transparent; }

#timestamp {
font-size: 12px;
color: var(--dim);
letter-spacing: 0.06em;
}

#signal-bar {
width: 140px;
height: 3px;
background: rgba(255,255,255,0.08);
}

#signal-fill {
height: 100%;
width: 100%;
background: #00eeff;
transition: width 0.12s linear, background 0.4s ease;
}

#hud-right{
display: flex;
align-items: center;
gap: 14px
}

#diff-label {
font-size: 11px;
color: var(--dim);
letter-spacing: 0.18em;
opacity: 0.5;
}

#score-display {
font-size: 13px;
color: var(--dim);
letter-spacing: 0.1em;
min-width: 40px;
text-align: right;
}

#word-timer-wrap {
position: fixed;
bottom: 0; left: 0; right: 0;
height: 2px;
z-index: 30;
background: rgba(255,255,255,0.05);
}

#word-timer-fill {
height: 100%;
width: 100%;
background: var(--dim);
transition: background 0.3s;
}

.screen {
position: fixed;
inset: 0;
display: flex;
flex-direction: column;
z-index: 50;
}

.screen.hidden { display: none; }


#game-screen,
#gameover-screen {
align-items: center;
justify-content: center;
}


#title-screen {
align-items: flex-start;
justify-content: flex-start;
padding: 0 12vw;
padding-top: clamp(64px, 18vh, 150px);
background-image: 
linear-gradient(to right, rgba(5,5,5,0.82) 0%, rgba(5,5,5,0.55) 55%, rgba(5,5,5,0.72) 100%), 
url('bg.jpg');
background-size: cover;
background-position: center 30%;
background-repeat: no-repeat;
}


#title-header {
display: flex;
align-items: center;
gap: 9px;
width: 100%;
padding-bottom: 10px;
border-bottom: 1px solid rgba(109,133,127,0.18);
margin-bottom: 26px;
}

#th-dot {
width: 7px;
height: 7px;
border-radius: 50%;
background: #cc2222;
flex-shrink: 0;
animation: standbyPulse 2.6s ease-in-out infinite
}

@keyframes standbyPulse {
0%, 42%, 58%, 100% { opacity: 1; }
50% { opacity: 0.15; }
}

#th-label {
font-size: 11px;
color: var(--dim);
letter-spacing: 0.18em;
text-transform: uppercase;
opacity: 0.6;
margin-right: auto;
}

#th-sig {
height: 3px;
width: 100px;
background: rgba(255,255,255,0.08);
}

#th-sig-fill {
height: 100%;
width: 100%;
background: rgba(0,220,255,0.45);
}

.glitch-title {
position: relative;
font-size: clamp(52px, 10vw, 88px);
letter-spacing: 0.22em;
text-transform: uppercase;
color: var(--white);
line-height: 1;
margin-bottom: 10px;
user-select: none;
}

.glitch-title::before,
.glitch-title::after {
content: attr(data-text);
position: absolute;
inset: 0;
}

.glitch-title::before {
color: cyan;
clip-path: polygon(0 0, 100% 0, 100% 48%, 0 48%);
animation: glitchTop 4s infinite;
}

.glitch-title::after {
color: red;
clip-path: polygon(0 52%, 100% 52%, 100% 100%, 0 100%);
animation: glitchBot 4s infinite;
}

@keyframes glitchTop {
0%, 85%, 87%, 90%, 100% { transform: translate(0,0); opacity:1; }
86% { transform: translate(-3px, 0); opacity: 0.9; }
88% { transform: translate(2px, 0); }
89% { transform: translate(-1px, 0); }
}

@keyframes glitchBot {
0%, 82%, 84%, 88%, 100% { transform: translate(0,0); opacity:1; }
83% { transform: translate(3px, 0); opacity: 0.9; }
85% { transform: translate(-2px, 0); }
87% { transform: translate(1px, 0); }
}

.subtitle {
font-size: 12px;
color: var(--dim);
letter-spacing: 0.25em;
text-transform: uppercase;
opacity: 0.7;
}


#title-rule {
display: flex;
align-items: center;
width: 100%;
margin: 24px 0 20px;
gap: 0;
}

#title-rule-line {
flex: 1;
height: 1px;
background: rgba(109,133,127,0.18);
}

#title-rule-sig {
width: 88px;
height: 2px;
background: rgba(255,255,255,0.06);
margin-left: 14px;
flex-shrink: 0;
}

#title-rule-sig-fill {
height: 100%;
width: 100%;
background: rgba(0,220,255,0.38);
}


#title-atmos {
position: absolute;
right: 7vw;
top: 38%;
bottom: 8%;
width:1px;
background: linear-gradient(to bottom,
transparent 0%,
rgba(109,133,127,0.07) 25%,
rgba(109,133,127,0.05) 60%,
transparent 100%
);
pointer-events: none;
}


#diff-picker {
display: flex;
gap: 6px;
margin-bottom: 22px;
align-items: center;
}

#diff-label-txt {
font-size: 10px;
color: var(--dim);
letter-spacing: 0.16em;
opacity: 0.4;
margin-right: 6px;
text-transform: uppercase;
}

.diff-btn {
background: none;
border: 1px solid rgba(109,133,127,0.3);
color: rgba(109,133,127,0.45);
font-family: 'Share Tech Mono', monospace;
font-size: 10px;
letter-spacing: 0.18em;
text-transform: uppercase;
padding: 5px 13px;
cursor: pointer;
transition: border-color 0.15s, color 0.15s;
}

.diff-btn:hover { border-color: var(--dim); color: var(--dim); }
.diff-btn.selected { border-color: var(--dim); color: var(--white); }


#start-btn {
background: none;
border: 1px solid var(--white);
color: var(--white);
font-family: 'Share Tech Mono', monospace;
font-size: 13px;
letter-spacing: 0.3em;
text-transform: uppercase;
padding: 14px 0;
width: 100%;
max-width: 420px;
cursor: pointer;
transition: background 0.18s;
text-align: center;
}

#start-btn:hover { background: rgba(217,246,239,0.04); }

.btn {
background: none;
border: 1px solid var(--dim);
color: var(--white);
font-family: 'Share Tech Mono', monospace;
font-size: 13px;
letter-spacing: 0.2em;
text-transform: uppercase;
padding: 10px 28px;
cursor: pointer;
transition: border-color 0.2s;
}

.btn:hover { border-color: var(--white); }

#game-screen { z-index: 40; }

#word-display {
position: relative;
display: inline-block;
font-size: clamp(36px, 7vw, 72px);
letter-spacing: 0.08em;
text-transform: uppercase;
color: var(--white);
margin-bottom: 36px;
min-height: 1.2em;
text-align: center;
}

#word-display::before,
#word-display::after {
content: attr(data-word);
position: absolute;
inset: 0;
text-align: center;
}

#word-display::before { color: cyan; }
#word-display::after { color: red; }

#typed-display {
font-size: 18px;
letter-spacing: 0.18em;
color: var(--dim);
min-height: 1.4em;
text-align: center;
}

#typed-display .correct { color: var(--white); }
#typed-display .wrong { color: #cc2222; }

#hidden-input {
position: fixed;
left: -9999px;
opacity: 0;
pointer-events: none;
}

@keyframes  wordAppear {
from { opacity: 0; letter-spacing: 0.3em; }
to { opacity: 1; letter-spacing: 0.08em; }
}

#word-display.flash { animation: wordAppear 0.18s ease-out forwards; }

@keyframes  mistakePulse {
0% { opacity: 1; }
20% { opacity: 0.3; }
100% { opacity: 1; }
}

#word-display.mistake { animation: mistakePulse 0.25s ease-out; }

#gameover-screen .glitch-title { margin-bottom: 12px; }

#final-score {
font-size: 13px;
color: var(--dim);
letter-spacing: 0.18em;
margin-bottom: 44px;
text-align: center;
line-height: 2;
}
</style>
</head>
<body>

 <div id="stage">
<canvas id="noise"></canvas>
<canvas id="glitch"></canvas>
<div id="scanlines"></div>
<div id="presence"></div>

<div id="jumpscare">
<div id="jumpscare-shape"></div>
<div id="jumpscare-cyan"></div>
<div id="jumpscare-red"></div>
</div>

<div id="ghost-overlay">
<div id="ghost-shape"></div>
</div>

<button id="mute-btn" aria-label="toggle audio">◈</button>

<div id="hud" class="hidden">
<div id="rec-group">
<div id="rec-dot"></div>
<span id="timestamp">00:00</span>
</div>
<div id="signal-bar"><div id="signal-fill"></div></div>
<div id="hud-right">
<div id="diff-label"></div>
<div id="score-display">0</div>
</div>
</div>

<div id="word-timer-wrap" class="hidden">
<div id="word-timer-fill"></div>
</div>

<div id="title-screen" class="screen">
<div id="title-header">
<div id="th-dot"></div>
<span id="th-label">STANDBY</span>
<div id="th-sig"><div id="th-sig-fill"></div></div>
</div>
<div class="glitch-title" data-text="TYPE TO SURVIVE">TYPE TO SURVIVE</div>
<div class="subtitle">type before the signal dies</div>
<div id="title-rule">
<div id="title-rule-line"></div>
<div id="title-rule-sig"><div id="title-rule-sig-fill"></div></div>
</div>
<div id="diff-picker">
<span id="diff-label-txt">signal</span>
<button class="diff-btn" data-diff="easy">EASY</button>
<button class="diff-btn selected" data-diff="normal">NORMAL</button>
<button class="diff-btn" data-diff="hard">HARD</button>
</div>
<button id="start-btn">TRANSMIT</button>
<div id="title-atmos"></div>
</div>

<div id="game-screen" class="screen hidden">
<div id="word-display" data-word=""></div>
<div id="typed-display"></div>
</div>

<div id="gameover-screen" class="screen hidden">
<div class="glitch-title" data-text="NO SIGNAL">NO SIGNAL</div>
<div id="final-score"></div>
<div style="display:flex;gap:14px">
<button class="btn" id="retry-btn">RECONNECT</button>
<button class="btn" id="menu-btn">MENU</button>
</div>
</div>

<input id="hidden-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false">
</div>

<style id="ca-style"></style>

<script>
const WORDS = [
"static","signal","noise","bleed","void","frequency","cut","dark",
"ghost","feed","dead","air","cold","flicker","black",
"interference","corrupt","broadcast","disrupt","decay","hollow",
"absent","null","broken","severed","fragment","loop","fall","trace",
"drift","pulse","tear","veil","lost","fade","sink","deep",
"crawl","watch","burn","still","wrong","wither","pull",
"shadow","creak","gone","below","dread","bare","scratch","cling",
"empty","stare","stand","moan","seep","hide","hunt","reach",
"vessel","unlit","stifle","descend","wander","wane","hollow"
];

const DIFFICULTY = {
easy: {
label: 'EASY',
wordBase: 4200, wordMin: 2800,
passiveDecay: 0.009,
missSignal: 0.08, typoSignal: 0.04, backspaceHit: 0.008,
boostBase: 0.06, boostTime: 0.14,
scoreBase: 10, scoreTime: 20,
critThreshold: 0.18,
},
normal: {
label: 'NORMAL',
wordBase: 3500, wordMin: 2200,
passiveDecay: 0.014,
missSignal: 0.12, typoSignal: 0.06, backspaceHit: 0.015,
boostBase: 0.04, boostTime: 0.10,
scoreBase: 10, scoreTime: 20,
critThreshold: 0.20,
},
hard: {
label: 'HARD',
wordBase: 2600, wordMin: 1500,
passiveDecay: 0.022,
missSignal: 0.18, typoSignal: 0.09, backspaceHit: 0.025,
boostBase: 0.025, boostTime: 0.07,
scoreBase: 15, scoreTime: 30,
critThreshold: 0.22,
},
};

const Snd = (() => {
let cx = null, muted = false;
let drones = [], droneGain, noiseSrc, noiseFilt, noiseGain, master;

function init() {
if (cx) { if (cx.state === 'suspended') cx.resume(); return; }
cx = new (window.AudioContext || window.webkitAudioContext)();

master = cx.createGain();
master.gain.value = muted ? 0 : 1;
master.connect(cx.destination);

const droneFilt = cx.createBiquadFilter();
droneFilt.type = 'lowpass';
droneFilt.frequency.value = 220;
droneGain = cx.createGain();
droneGain.gain.value = 0.025;

[42, 43.5].forEach(freq => {
const o = cx.createOscillator();
o.type = 'sawtooth';
o.frequency.value = freq;
o.connect(droneFilt);
o.start();
drones.push(o);
});
droneFilt.connect(droneGain);
droneGain.connect(master);

const bufSize = cx.sampleRate * 3;
const buf = cx.createBuffer(1, bufSize, cx.sampleRate);
const bd = buf.getChannelData(0);
for (let i = 0; i < bufSize; i++) bd[i] = Math.random() * 2 - 1;

noiseSrc = cx.createBufferSource();
noiseSrc.buffer = buf;
noiseSrc.loop = true;
noiseFilt = cx.createBiquadFilter();
noiseFilt.type = 'bandpass';
noiseFilt.frequency.value = 350;
noiseFilt.Q.value = 0.4;
noiseGain = cx.createGain();
noiseGain.gain.value = 0.008;

noiseSrc.connect(noiseFilt);
noiseFilt.connect(noiseGain);
noiseGain.connect(master);
noiseSrc.start();
}

function update(sig) {
if (!cx || cx.state === 'suspended') return;
const t = cx.currentTime, d = 1 - sig;
const baseFreqs = [42, 43.5];
drones.forEach((o, i) => o.frequency.setTargetAtTime(baseFreqs[i] + d * 22, t, 0.5));
droneGain.gain.setTargetAtTime(0.025 + d * 0.11, t, 0.4);
noiseFilt.frequency.setTargetAtTime(350 + d * 1800, t, 0.4);
noiseFilt.Q.setTargetAtTime(0.4 + d * 1.0, t, 0.4);
noiseGain.gain.setTargetAtTime(0.008 + d * 0.065, t, 0.4);
}

function stinger(variant) {
if (!cx || cx.state === 'suspended') return;
const t = cx.currentTime;

if (variant === 'death') {
const osc = cx.createOscillator();
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(200, t);
osc.frequency.exponentialRampToValueAtTime(25, t + 0.6);
const g = cx.createGain();
g.gain.setValueAtTime(0.25, t);
g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
osc.connect(g); g.connect(master);
osc.start(t); osc.stop(t + 0.62);
}

if (variant === 'ghost') {
const thud = cx.createOscillator();
thud.type = 'sine';
thud.frequency.setValueAtTime(55, t);
thud.frequency.exponentialRampToValueAtTime(28, t + 0.1);
const tg =cx.createGain();
tg.gain.setValueAtTime(0.13, t);
tg.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
thud.connect(tg); tg.connect(master);
thud.start(t); thud.stop(t + 0.12);
}

const dur = variant === 'death' ? 0.14 : variant === 'ghost' ? 0.07 : 0.09;
const vol = variant === 'death' ? 0.55 : variant === 'ghost' ? 0.18 : 0.38;
const nbuf = cx.createBuffer(1, cx.sampleRate * dur | 0, cx.sampleRate);
const nd = nbuf.getChannelData(0);
for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

const filt = cx.createBiquadFilter();
filt.type = variant === 'ghost' ? 'bandpass' : 'highpass';
filt.frequency.value = variant === 'ghost' ? 900 : 2500;

const src = cx.createBufferSource();
src.buffer = nbuf;
const g = cx.createGain();
g.gain.setValueAtTime(vol, t);
g.gain.exponentialRampToValueAtTime(0.001, t + dur);
src.connect(filt); filt.connect(g); g.connect(master);
src.start(t);
}

function blip(type) {
if (!cx || cx.state === 'suspended') return;
const t = cx.currentTime;
const osc = cx.createOscillator(); 
const g = cx.createGain();
if (type === 'ok') {
osc.type = 'sine';
osc.frequency.setValueAtTime(880, t);
osc.frequency.setValueAtTime(1100, t + 0.025);
g.gain.setValueAtTime(0.055, t);
g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
} else {
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(110, t);
osc.frequency.exponentialRampToValueAtTime(70, t + 0.045);
g.gain.setValueAtTime(0.04, t);
g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
}
osc.connect(g); g.connect(master);
osc.start(t); osc.stop(t + 0.1);
}

function toggleMute() {
muted = !muted;
if (master) master.gain.value = muted ? 0 : 1;
return muted;
}

return  { init, update, stinger, blip, toggleMute, isMuted: () => muted };
})();

let diff = DIFFICULTY.normal;
let signal, score, elapsed, currentWord, wordDeadline, wordDuration;
let running = false, lastTick, lastAudioTick = 0;
let noiseTimer, glitchTimer, ghostTimer;
let critFired = false, critFiredTime = 0;
let ghostFired = false;


const noiseCanvas = document.getElementById('noise');
const glitchCanvas = document.getElementById('glitch');
const noiseCtx = noiseCanvas.getContext('2d');
const glitchCtx = glitchCanvas.getContext('2d');

const el = {
hud: document.getElementById('hud'),
recDot: document.getElementById('rec-dot'),
ts: document.getElementById('timestamp'),
sigFill: document.getElementById('signal-fill'),
scoreDisp: document.getElementById('score-display'),
diffLabel: document.getElementById('diff-label'),
timerWrap: document.getElementById('word-timer-wrap'),
timerFill: document.getElementById('word-timer-fill'),
presence: document.getElementById('presence'),
jumpscare: document.getElementById('jumpscare'),
jsShape: document.getElementById('jumpscare-shape'),
ghostOv: document.getElementById('ghost-overlay'),
ghostShape: document.getElementById('ghost-shape'),
muteBtn:  document.getElementById('mute-btn'),
titleScr: document.getElementById('title-screen'),
gameScr: document.getElementById('game-screen'),
overScr: document.getElementById('gameover-screen'),
word: document.getElementById('word-display'),
typed: document.getElementById('typed-display'),
input: document.getElementById('hidden-input'),
finalTxt: document.getElementById('final-score'),
startBtn: document.getElementById('start-btn'),
retryBtn: document.getElementById('retry-btn'),
caStyle: document.getElementById('ca-style'),
diffBtns: document.querySelectorAll('.diff-btn'),
};


function resize() {
noiseCanvas.width = glitchCanvas.width = window.innerHeight;
noiseCanvas.height = glitchCanvas.height = window.innerHeight;
}

function renderNoise(intensity) {
const w = noiseCanvas.width, h = noiseCanvas.height;
const img = noiseCtx.createImageData(w, h);
const d = img.data;
for (let i = 0; i < d.length; i += 4) {
const lit = Math.random() < intensity;
const v = lit ? (Math.random() * 255 | 0) : 0;
d[i] = d[i+1] = d[i+2] = v;
d[i+3] = lit ? 180 : 0;
}
noiseCtx.putImageData(img, 0, 0);
}

function renderGlitch(intensity){
glitchCtx.clearRect(0, 0, glitchCanvas.width, glitchCanvas.height);
if (Math.random() > intensity * 0.75) return;
const bars = Math.ceil(intensity * 5);
for(let i = 0; i < bars; i++) {
const y = Math.random() * glitchCanvas.height;
const bh = 1 + Math.random() * 6 * intensity;
const shift = (Math.random() - 0.5) * 60 * intensity;
glitchCtx.fillStyle = `rgba(217,246,239,${0.05 + Math.random() * 0.08 * intensity})`;
glitchCtx.fillRect(shift, y, glitchCanvas.width, bh);
}
}

function setAmbient(degradation) {
noiseCanvas.style.opacity = 0.02 + degradation * 0.10;
const sl = document.getElementById('scanlines');
sl.style.animationDuration = (8 - degradation * 5) + 's';
sl.style.opacity = 0.3 + degradation * 0.5;
}


function updatePresence(sig) {
const t = 1 - sig;
el.presence.style.opacity = Math.max(0, t * 0.95 - 0.05);
el.presence.style.transform = `translateX(-50%) scaleX(${1.4 + t}) scaleY(${1 + t * 0.6})`;
}

function pulsePresence() {
const t = 1 - signal;
el.presence.style.transition = 'opacity 0.12s ease, transform 0.12s ease';
el.presence.style.opacity = Math.min(1, (t + 0.18) * 0.95);
el.presence.style.transform = `translateX(-50%) scaleX(${1.6 + t}) scaleY(${1.3 + t * 0.6})`;
setTimeout(() => {
el.presence.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
updatePresence(signal);
}, 300);
}


function setAberration(sig) {
const spread = sig > 0.5 ? 1 : Math.round(1 + (1 - sig * 2) * 5);
el.caStyle.textContent =
`#word-display::before{transform:translateX(-${spread}px);}` +
`#word-display::after{transform:translateX(${spread}px);}`;
}

function signalColor(sig) {
if (sig > 0.5) {
const t =  (sig - 0.5) * 2;
return  `rgb(${Math.round(255*(1-t))},${Math.round(200+55*t)},255)`;
}
return `rgb(255,${Math.round(140 * sig * 2)},0)`;
}

function updateHUD() {
el.sigFill.style.width = Math.max(0, signal * 100) + '%';
el.sigFill.style.background = signalColor(signal);
el.scoreDisp.textContent = score;
}
</script>
</body>
