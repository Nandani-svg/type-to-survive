<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYPE TO SURVIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
--white: #d9f6ef;
--dim: #6d857f;
--bg: #050505;
}

html, body {
width: 100%; height: 100%;
overflow: hidden;
background: var(--bg);
color: var(--white);
font-family: 'Share Tech Mono', monospace;
}

#stage{
position: fixed;
inset: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
}

#stage::after {
content: '';
position: fixed;
inset: 0;
background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.82) 100%);
pointer-events: none;
z-index: 10;
}

#scanlines {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 20;
background: repeating-linear-gradient(
to bottom,
transparent,
transparent 2px,
rgba(0,0,0,0.18) 2px,
rgba(0,0,0,0.18) 4px
);
animation: scabDrift 8s linear infinite;
opacity: 0.5;
}

@keyframes scanDrift {
from { background-position: 0 0; }
to { background-position: 0 100vh; }
}

#noise {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 21;
opacity: 0.04;
}

#glitch {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 22;
}

#presence {
position: fixed;
bottom: 0;
left: 50%;
width: 340px;
height: 180px;
background: radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.97) 0%, transparent 70%);
filter: blur(28px);
pointer-events: none;
z-index: 9;
opacity: 0;
transform-origin: bottom center;
transition: opacity 0.6s ease, transform 0.6s ease;
}

#jumpscare {
position: fixed;
inset: 0;
z-index: 200;
display: none;
overflow: hidden;
background: #fff;
}

#jumpscare-shape {
position: absolute;
bottom: -10%;
left: 50%;
width: 200vw;
height: 180vh;
transform: translateX(-50%);
transform-origin: bottom center;
background: radial-gradient(ellipse at 50% 100%,
rgba(0,0,0,1) 0%, rgba(0,0,0,0.95) 18%, rgba(20,0,0,0.7) 38%, transparent 62%);
}

#jumpscare-cyan{
position: absolute;
inset: 0;
background: radial-gradient(ellipse at 52% 100%, rgba(0,230,255,0.18) 0%, transparent 55%);
}

#jumpscare-red{
position: absolute;
inset: 0;
background: radial-gradient(ellipse at 48% 100%, rgba(255,0,0,0.15) 0%, transparent 55%);
}


#ghost-overlay {
position: fixed;
inset: 0;
z-index: 203;
display: none;
pointer-events: none;
background: rgba(255,255,255,0.035);
}

#ghost-shape {
position: absolute;
inset: 0;
filter: blur(10px);
}


#mute-btn {
position: fixed;
bottom: 18px;
right: 18px;
z-index: 60;
background: none;
border: 1px solid rgba(109,133,127,0.22);
color: rgba(109,133,127,0.38);
font-family: 'Share Tech Mono', monospace;
font-size: 11px;
letter-spacing: 0.08em;
padding: 4px 9px;
cursor: pointer;
transition: border-color 0.2s, color 0.2s;
}

#mute-btn:hover { border-color: rgba(109,133,127,0.55); color: rgba(109,133,127,0.65); }
#mute-btn.muted { color: rgba(109,133,127,0.18); border-color: rgba(109,133,127,0.1); }

#hud {
position: fixed;
top: 0; left: 0; right: 0;
z-index: 30;
padding: 14px 18px 0;
display: flex;
align-items: center;
}

#rec-group {
display: flex;
align-items: center;
gap: 7px;
margin-right: auto;
}

#rec-dot {
width: 8px; height: 8px;
border-radius: 50%;
background: #cc2222;
flex-shrink: 0;
}

#rec-dot.blink { background: transparent; }

#timestamp {
font-size: 12px;
color: var(--dim);
letter-spacing: 0.06em;
}

#signal-bar {
width: 140px;
height: 3px;
background: rgba(255,255,255,0.08);
}

#signal-fill {
height: 100%;
width: 100%;
background: #00eeff;
transition: width 0.12s linear, background 0.4s ease;
}

#hud-right{
display: flex;
align-items: center;
gap: 14px
}

#diff-label {
font-size: 11px;
color: var(--dim);
letter-spacing: 0.18em;
opacity: 0.5;
}

#score-display {
font-size: 13px;
color: var(--dim);
letter-spacing: 0.1em;
min-width: 40px;
text-align: right;
}

#word-timer-wrap {
position: fixed;
bottom: 0, left: 0; right: 0;
height: 2px;
z-index: 30;
background: rgba(255,255,255,0.05);
}

#word-timer-fill {
height: 100%;
width: 100%;
background: var(--dim);
transition: background 0.3s;
}
</style>
</head>
<body>

 <div id="stage">
<canvas id="noise"></canvas>
<canvas id="glitch"></canvas>
<div id="scanlines"></div>
<div id="presence"></div>

<div id="jumpscare">
<div id="jumpscare-shape"></div>
<div id="jumpscare-cyan"></div>
<div id="jumpscare-red"></div>
</div>

<div id="ghost-overlay">
<div id="ghost-shape"></div>
</div>

<button id="mute-btn" aria-label="toggle audio">◈</button>

<div id="hud" class="hidden">
<div id="rec-group">
<div id="rec-dot"></div>
<span id="timestamp">00:00</span>
</div>
<div id="signal-bar"></div id="signal-fill"></div></div>
<div id="hud-right">
<div id="diff-label"></div>
<div id="score-display">0</div>
</div>
</div>

<div id="word-timer-wrap" class="hidden">
<div id="word-timer-fill"></div>
</div>

<div id="title-screen" class="screen">
<div id="title-header">
<div id="th-dot"></div>
<span id="th-label">STANDBY</span>
<div id="th-sig"></div id="th-sig-fill"></div></div>
</div>
<div class="glitch-title" data-text="TYPE TO SURVIVE">TYPE TO SURVIVE</div>
<div class="subtitle">type before the signal dies</div>
<div id="title-rule">
<div id="title-rule-line"></div>
<div id="title-rule-sig"><div id="title-rule-sig-fill"></div></div>
</div>
<div id="diff-picker">
<span id="diff-label-txt">signal</span>
<button class="diff-btn" data-diff="easy">EASY</button>
<button class="diff-btn selected" data-diff="normal">NORMAL</button>
<button class="diff-btn" data-diff="hard">HARD</button>
</div>
<button id="start-btn">TRANSMIT</button>
<div id="title-atmos"></div>
</div>

<div id="game-screen" class="screen hidden">
<div id="word-display" data-word=""></div>
<div id="typed-display"></div>
</div>

<div id="gameover-screen" class="screen hidden">
<div class="glitch-title" data-text="NO SIGNAL">NO SIGNAL</div>
<div id="final-score"></div>
<div style="display:flex;gap:14px">
<button class="btn" id="menu-btn">MENU</button>
</div>
</div>

<input id="hidden-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false">
</div>

<style id="ca-style"></style>

<script>
</script>
</body>
</html>
